<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Times Coffee — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=EB+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0d2417;
    --bg-deep-2:#0a1e12;
    --gold:#c9a24a;
    --gold-light:#e6cd8c;
    --cream:#f3e6c4;
    --card:#f2e3bd;
    --maroon:#7a2320;
    --maroon-dark:#5c1a18;
    --ivory:#f7efe0;
    --line: rgba(201,162,74,0.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg-deep-2); color:var(--ivory); font-family:'Cairo', sans-serif; overflow-x:hidden;}

  .phone{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(201,162,74,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
    position:relative;
    padding-bottom:20px;
  }

  /* decorative botanical corners */
  .leaf-corner{
    position:absolute;
    width:180px; height:260px;
    opacity:0.16;
    pointer-events:none;
    z-index:0;
  }
  .leaf-tl{ top:70px; left:-40px; transform:scaleX(-1) rotate(8deg);}
  .leaf-tr{ top:70px; right:-40px; transform:rotate(-8deg);}
  .leaf-bl{ bottom:120px; left:-50px;}
  .leaf-br{ bottom:120px; right:-50px; transform:scaleX(-1);}

  /* Top bar */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 14px 20px;
    border-bottom:1px solid var(--line);
    position:relative; z-index:2;
  }
  .topbar .icons-left{ display:flex; gap:18px; align-items:center;}
  .icon-btn{
    width:26px; height:26px; color:var(--gold);
    position:relative; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn svg{ width:100%; height:100%; stroke:var(--gold); fill:none; }
  .dot-red{
    position:absolute; top:-2px; right:-2px; width:8px; height:8px; border-radius:50%;
    background:#c23b2f; box-shadow:0 0 0 2px var(--bg-deep);
  }
  .chevron{ color:var(--gold); opacity:0.9; }

  /* Hero */
  .hero{
    text-align:center;
    padding:30px 20px 10px 20px;
    position:relative; z-index:2;
  }
  .logo-card{
    width:250px;
    margin:0 auto;
  }
  .logo-card img{
    width:100%; height:100%; display:block;
    object-fit:contain;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.5));
  }

  .section-title-row{
    display:flex; align-items:baseline; justify-content:center; gap:14px;
    margin:26px 0 18px 0;
    position:relative; z-index:2;
  }
  .section-title-row .en{
    font-family:'Cormorant Garamond', serif;
    font-size:30px; font-weight:700; color:var(--ivory);
  }
  .section-title-row .ar{
    font-size:22px; font-weight:800; color:var(--ivory);
  }
  .title-underline{
    width:220px; height:1px; background:var(--gold);
    margin:0 auto 22px auto; opacity:0.7; position:relative; z-index:2;
  }

  


  /* Sequential menu + icon category bar */
  .sequential-category-nav{
    position:sticky;
    top:0;
    z-index:15;
    display:flex;
    flex-direction:column;
    gap:9px;
    padding:10px 12px 12px;
    margin:0 -1px 8px;
    background:rgba(10,25,16,.97);
    border-bottom:1px solid var(--line);
  }
  .sequential-category-nav button{
    width:100%;
    min-height:64px;
    border:1px solid var(--gold);
    background:linear-gradient(180deg,var(--card),#ecd8ab);
    color:var(--maroon);
    border-radius:15px;
    padding:7px 5px;
    font-family:'Cairo',sans-serif;
    font-size:10.5px;
    font-weight:800;
    cursor:pointer;
    white-space:normal;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:flex-start;
    gap:12px;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
    text-align:right;
  }
  .sequential-category-nav button .cat-nav-icon{
    width:40px;
    height:40px;
    flex:0 0 40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--maroon);
  }
  .sequential-category-nav button .cat-nav-icon svg{
    width:30px;
    height:30px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.6;
  }
  .sequential-category-nav button.active{
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    transform:translateY(-1px);
  }
  .sequential-category-view{
    display:block;
    padding:0 18px 110px;
    position:relative;
    z-index:2;
  }
  .sequential-category-section{
    scroll-margin-top:105px;
    margin:0 0 30px;
  }
  .sequential-category-section .seq-title{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0;
    margin:22px 0 10px;
    color:var(--ivory);
    font-weight:800;
    text-align:center;
  }
  .sequential-category-section .seq-title .ar{font-size:22px}
  .sequential-category-section .seq-title .en{
    font-family:'Cormorant Garamond',serif;
    font-size:23px;
    opacity:.78;
  }
  .sequential-category-section .seq-line{
    width:190px;
    height:1px;
    background:var(--gold);
    opacity:.65;
    margin:0 auto 12px;
  }
  .sequential-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 4px;
    border-bottom:1px solid var(--line);
  }
  .sequential-item .item-name{min-width:0;text-align:right}
  .sequential-item .item-name .ar{
    font-weight:800;font-size:19px;color:var(--ivory)
  }
  .sequential-item .item-name .en{
    margin-top:2px;font-family:'Cormorant Garamond',serif;font-size:17px;opacity:.72
  }
  .sequential-item .item-price{
    white-space:nowrap;color:var(--gold-light);font-weight:800;font-size:14px
  }
  .pager-wrap > .pager-dots{display:none !important}

  /* grid / pager */
  /* grid */
  .grid{
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:18px 14px; padding:0 18px; position:relative; z-index:2;
  }
  .cat-card{
    background:transparent;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .cat-card:active .cat-icon-box{ transform:scale(0.94); }
  .cat-icon-box{
    background:linear-gradient(180deg, var(--card), #ecd8ab);
    border:1.5px solid var(--gold);
    border-radius:16px;
    width:100%;
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
    transition:transform .15s ease;
    margin-bottom:10px;
  }
  .cat-icon-box svg{
    width:56px; height:56px; stroke:var(--maroon); fill:none; stroke-width:1.6;
  }
  .cat-icon-box img.cat-img{
    width:100%; height:100%; object-fit:cover; border-radius:16px;
  }
  .cat-en{ font-weight:700; font-size:13.5px; color:var(--ivory); margin-bottom:2px;}
  .cat-ar{ font-weight:700; font-size:13px; color:var(--gold-light); }

  .pager-wrap{
    position:relative;
  }
  .pager-dots{ display:none; }

  @keyframes cardIn{
    from{ opacity:0; transform:translateY(24px) scale(0.9); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .cat-card{ animation: cardIn .6s ease both; }

  .logo-card{ cursor:pointer; user-select:none; }

  /* ===== Hero carousel ===== */
  .hero-carousel{
    width:260px; height:170px; margin:6px auto 4px auto;
    border-radius:20px; overflow:hidden; position:relative;
    box-shadow:0 8px 22px rgba(0,0,0,0.4), 0 0 0 1px rgba(201,162,74,0.35);
    cursor:pointer;
  }
  .hc-slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; transition:opacity .6s ease;
    background:linear-gradient(160deg, var(--card), #e6cf9c);
  }
  .hc-slide.active{ opacity:1; }
  .hc-slide img{ width:100%; height:100%; object-fit:cover; }
  .hc-slide svg{ width:64px; height:64px; stroke:var(--maroon); fill:none; stroke-width:1.5; }
  .hc-caption{
    position:absolute; left:0; right:0; bottom:0;
    padding:10px 14px 8px 14px;
    background:linear-gradient(0deg, rgba(0,0,0,0.65), transparent);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .hc-caption .en{ color:#fff; font-weight:800; font-size:13.5px; }
  .hc-caption .ar{ color:#f3e6c4; font-weight:700; font-size:12.5px; }
  .hc-dots{
    display:flex; justify-content:center; gap:5px; margin-top:10px;
  }
  .hc-dot{ width:6px; height:6px; border-radius:50%; background:rgba(201,162,74,0.35); transition:background .3s; }
  .hc-dot.active{ background:var(--gold); }

  /* ===== PIN modal ===== */
  .pin-overlay{
    position:fixed; inset:0; background:rgba(6,15,10,0.8);
    z-index:80; display:none; align-items:center; justify-content:center;
  }
  .pin-overlay.open{ display:flex; }
  .pin-box{
    width:82%; max-width:300px;
    background:linear-gradient(180deg, var(--bg-deep), var(--bg-deep-2));
    border:1.5px solid var(--gold); border-radius:18px;
    padding:22px; text-align:center;
  }
  .pin-box h3{ margin:0 0 12px 0; font-size:16px; color:var(--ivory); }
  .pin-box input{
    width:100%; padding:12px; border-radius:10px; border:1px solid var(--gold);
    background:var(--cream); color:#2b1a0a; font-size:20px; text-align:center;
    letter-spacing:6px; margin-bottom:14px; box-sizing:border-box;
  }
  .pin-box .row{ display:flex; gap:10px; }
  .pin-box button{
    flex:1; padding:10px; border-radius:10px; border:none; font-weight:700;
    cursor:pointer; font-family:'Cairo',sans-serif; font-size:14px;
  }
  .pin-confirm{ background:var(--gold); color:#2b1a0a; }
  .pin-cancel{ background:transparent; color:var(--gold-light); border:1px solid var(--gold) !important; }
  .pin-error{ color:#e07a6f; font-size:12px; min-height:16px; margin-bottom:6px; }

  /* ===== Admin panel ===== */
  .admin-overlay{
    position:fixed; inset:0; background:var(--bg-deep-2);
    z-index:90; display:none; flex-direction:column;
  }
  .admin-overlay.open{ display:flex; }
  .admin-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; border-bottom:1px solid var(--line);
    background:var(--bg-deep);
  }
  .admin-header h2{ margin:0; font-size:17px; color:var(--gold-light); }
  .admin-close{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--gold);
    color:var(--gold); display:flex; align-items:center; justify-content:center;
    cursor:pointer; background:transparent; font-size:16px;
  }
  .admin-body{ flex:1; overflow-y:auto; padding:16px; }
  .admin-add-cat{
    width:100%; padding:12px; border-radius:12px; border:1.5px dashed var(--gold);
    background:transparent; color:var(--gold-light); font-weight:700; cursor:pointer;
    margin-bottom:16px; font-family:'Cairo',sans-serif; font-size:14px;
  }
  .admin-cat{
    background:rgba(243,230,196,0.06); border:1px solid var(--line);
    border-radius:14px; padding:14px; margin-bottom:14px;
  }
  .admin-row{ display:flex; gap:8px; margin-bottom:8px; }
  .admin-row input[type=text]{
    flex:1; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--cream); color:#2b1a0a; font-size:13px; font-family:'Cairo',sans-serif;
    min-width:0;
  }
  .admin-thumb-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .admin-thumb{
    width:44px; height:44px; border-radius:8px; object-fit:cover;
    background:var(--card); border:1px solid var(--gold);
  }
  .admin-file-label{
    font-size:11.5px; color:var(--gold-light); border:1px solid var(--gold);
    padding:6px 10px; border-radius:8px; cursor:pointer;
  }
  .admin-file-label input{ display:none; }
  .admin-del-btn{
    background:#7a2320; color:#f2d8d5; border:none; border-radius:8px;
    padding:6px 10px; font-size:11.5px; cursor:pointer; font-family:'Cairo',sans-serif;
  }
  .admin-items{ margin-top:8px; border-top:1px dashed var(--line); padding-top:10px; }
  .admin-item-row{ display:flex; gap:6px; margin-bottom:8px; align-items:center; flex-wrap:wrap; }
  .admin-item-row input[type=text]{
    padding:8px 9px; border-radius:8px; border:1px solid var(--line);
    background:var(--cream); color:#2b1a0a; font-size:12.5px; font-family:'Cairo',sans-serif;
    min-width:0;
  }
  .admin-item-row .fen{ flex:1.3; }
  .admin-item-row .far{ flex:1.3; }
  .admin-item-row .fprice{ flex:0.8; }
  .admin-add-item{
    background:transparent; border:1px dashed var(--gold-light); color:var(--gold-light);
    border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer;
    font-family:'Cairo',sans-serif; margin-top:4px;
  }
  .admin-save-bar{
    padding:14px 16px; border-top:1px solid var(--line); background:var(--bg-deep);
  }
  .admin-save-btn{
    width:100%; padding:13px; border-radius:12px; border:none;
    background:var(--gold); color:#2b1a0a; font-weight:800; font-size:15px;
    cursor:pointer; font-family:'Cairo',sans-serif;
  }
  .admin-saved-msg{
    text-align:center; color:#8fd18f; font-size:12px; margin-top:8px; min-height:14px;
  }
  .sync-box{
    margin:0 16px 14px 16px; padding:14px; border-radius:12px;
    background:rgba(201,162,74,0.08); border:1px solid var(--line);
  }
  .sync-box h3{ margin:0 0 10px 0; font-size:14px; color:var(--gold-light); }
  .sync-status{ font-size:12px; color:var(--ink); margin-bottom:10px; line-height:1.8; }
  .sync-code{
    font-family:monospace; font-size:15px; font-weight:700; color:var(--gold);
    background:rgba(0,0,0,0.25); padding:6px 10px; border-radius:8px;
    letter-spacing:1px; display:inline-block; margin-bottom:8px; user-select:all;
  }
  .sync-row{ display:flex; gap:8px; margin-top:8px; }
  .sync-row input{
    flex:1; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--cream); color:#2b1a0a; font-size:13px; font-family:monospace;
    min-width:0;
  }
  .sync-btn{
    padding:9px 14px; border-radius:8px; border:none; background:var(--gold);
    color:#2b1a0a; font-weight:700; font-size:12.5px; cursor:pointer;
    font-family:'Cairo',sans-serif; white-space:nowrap;
  }
  .sync-btn.secondary{ background:transparent; border:1px solid var(--gold); color:var(--gold-light); }

  /* bottom nav */
  .bottomnav{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    width:calc(100% - 32px); max-width:448px;
    background:linear-gradient(180deg, #123420, #0c2517);
    border:1.5px solid var(--gold);
    border-radius:22px;
    display:flex; justify-content:space-around; align-items:center;
    padding:12px 6px;
    z-index:20;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--gold-light); font-size:11px; font-weight:600;
    cursor:pointer; flex:1;
  }
  .nav-item svg{ width:22px; height:22px; stroke:var(--gold-light); fill:none; stroke-width:1.6;}

  /* Category detail panel */
  .panel-overlay{
    position:fixed; inset:0; background:rgba(6,15,10,0.72);
    z-index:50; display:none; align-items:flex-end; justify-content:center;
  }
  .panel-overlay.open{ display:flex; }
  .panel{
    width:100%; max-width:480px;
    max-height:88vh;
    background:linear-gradient(180deg, #0f2a1d, #0a1e12);
    border-top:1.5px solid var(--gold);
    border-radius:24px 24px 0 0;
    padding:18px 18px 24px 18px;
    overflow-y:auto;
    animation: slideUp .28s ease;
  }
  @keyframes slideUp{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .panel-handle{
    width:44px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 14px auto;
  }
  .panel-header{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;
  }
  .panel-title{ display:flex; flex-direction:column; }
  .panel-title .en{ font-family:'Cormorant Garamond', serif; font-size:26px; font-weight:700; color:var(--ivory);}
  .panel-title .ar{ font-size:15px; color:var(--gold-light); font-weight:600;}
  .close-btn{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--gold);
    display:flex; align-items:center; justify-content:center; color:var(--gold);
    cursor:pointer; background:transparent;
  }
  .item-row{
    display:flex; align-items:center; gap:12px;
    background:rgba(243,230,196,0.06);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    margin-bottom:10px;
  }
  .item-icon{
    width:44px; height:44px; border-radius:10px;
    background:var(--card);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    position:relative;
  }
  .item-icon svg{ width:26px; height:26px; stroke:var(--maroon); fill:none; stroke-width:1.7;}
  .item-icon img{ width:100%; height:100%; object-fit:cover; border-radius:10px; }
  .item-info{ flex:1; }
  .item-info .name-en{ font-size:14px; font-weight:700; color:var(--ivory);}
  .item-info .name-ar{ font-size:12.5px; color:var(--gold-light); margin-top:1px;}
  .item-price{
    font-family:'Cormorant Garamond', serif;
    font-weight:700; font-size:16px; color:var(--gold-light);
    white-space:nowrap;
  }
  .empty-note{
    text-align:center; color:var(--gold-light); font-size:12.5px; opacity:0.75;
    margin-top:14px; line-height:1.9;
  }

  /* Category landing page — vertical 3-column cards */
  #sequentialCategoryNav{display:none !important;}
  #sequentialCategoryView{
    display:block !important;
    padding:0 18px 120px;
  }
  .sequential-category-section{scroll-margin-top:20px;margin:30px 0 36px;}
  .sequential-category-section .seq-title{display:flex;flex-direction:column;align-items:center;text-align:center;margin:0 0 10px;}
  .sequential-category-section .seq-title .ar{color:var(--ivory);font-size:23px;font-weight:800;}
  .sequential-category-section .seq-title .en{color:var(--gold-light);font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;}
  .sequential-category-section .seq-line{width:190px;height:1px;background:var(--gold);opacity:.7;margin:0 auto 14px;}
  .sequential-items{display:flex;flex-direction:column;gap:8px;}
  .sequential-item{display:flex;align-items:center;gap:10px;background:rgba(243,230,196,.06);border:1px solid var(--line);border-radius:13px;padding:10px 12px;min-height:58px;}
  .sequential-item .item-icon{width:64px;height:64px;flex:0 0 64px;border-radius:12px;background:#ffffff;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .sequential-item .item-icon svg{width:36px;height:36px;stroke:var(--maroon);fill:none;stroke-width:1.6;}
  .sequential-item .item-icon img{width:100%;height:100%;object-fit:cover;border-radius:12px;}
  .sequential-item .item-name{flex:1;min-width:0;text-align:right;}
  .sequential-item .item-name .en{color:var(--ivory);font-size:17px;font-weight:700;}
  .sequential-item .item-name .ar{color:var(--gold-light);font-size:15px;margin-top:2px;}
  .sequential-item .item-price{color:var(--gold);font-family:'Cairo',sans-serif;font-size:13px;font-weight:800;white-space:nowrap;margin-top:5px;}
  .pager-wrap > .grid{
    display:grid !important;
  }
  .grid{
    grid-template-columns:repeat(3,1fr) !important;
    gap:18px 14px !important;
    padding:0 18px 120px !important;
  }
  .cat-card{
    display:flex !important;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .cat-icon-box{
    width:100%;
    aspect-ratio:1/1;
    min-height:0;
    border-radius:18px;
  }
  .cat-card .cat-name,
  .cat-card .cat-label{
    margin-top:8px;
  }

</style>
</head>

async function sha256Hex(str){
  const buf = new TextEncoder().encode(str);
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
let state = { categories: JSON.parse(JSON.stringify(CATEGORIES)) };
let uidCounter = 1;
function uid(){ return 'id' + (uidCounter++); }
state.categories.forEach(c=>{ c.id = c.id || uid(); c.items.forEach(it=> it.id = it.id || uid()); });

/* ===== Cross-device sync (jsonblob.com free anonymous JSON storage) ===== */
const SYNC_KEY = 'times-coffee-sync-id';
function getSyncId(){
  try{ return window.localStorage.getItem(SYNC_KEY); }catch(e){ return null; }
}
function setSyncId(id){
  try{ window.localStorage.setItem(SYNC_KEY, id); }catch(e){}
}
async function syncPull(){
  const id = getSyncId();
  if(!id) return false;
  try{
    const res = await fetch('https://jsonblob.com/api/jsonBlob/' + id);
    if(!res.ok) return false;
    const data = await res.json();
    if(data && Array.isArray(data.categories)){ state = data; return true; }
  }catch(e){ console.error('sync pull failed', e); }
  return false;
}
async function syncPush(){
  const id = getSyncId();
  if(!id) return false;
  try{
    await fetch('https://jsonblob.com/api/jsonBlob/' + id, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
    return true;
  }catch(e){ console.error('sync push failed', e); return false; }
}
async function createSync(){
  try{
    const res = await fetch('https://jsonblob.com/api/jsonBlob', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
    const loc = res.headers.get('Location') || res.headers.get('location');
    const id = loc ? loc.split('/').pop() : null;
    if(id){ setSyncId(id); renderAdmin(); }
    else alert('صار خطأ، جرب مرة ثانية');
  }catch(e){ alert('ما قدرت أتصل بالإنترنت، جرب مرة ثانية'); }
}
async function linkSync(inputId){
  const id = (inputId||'').trim();
  if(!id) return;
  try{
    const res = await fetch('https://jsonblob.com/api/jsonBlob/' + id);
    if(!res.ok){ alert('الكود غير صحيح'); return; }
    const data = await res.json();
    if(data && Array.isArray(data.categories)){
      state = data;
      setSyncId(id);
      renderAdmin();
      renderGrid();
    } else {
      alert('الكود غير صحيح');
    }
  }catch(e){ alert('ما قدرت أتصل بالإنترنت'); }
}
function unlinkSync(){
  try{ window.localStorage.removeItem(SYNC_KEY); }catch(e){}
  renderAdmin();
}

async function loadState(){
  const synced = await syncPull();
  if(!synced){
  try{
    if(window.storage){
      const res = await window.storage.get('menu-data', false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        if(parsed && Array.isArray(parsed.categories)) state = parsed;
      }
    } else if(window.localStorage){
      const raw = window.localStorage.getItem('times-coffee-menu-data');
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.categories)) state = parsed;
      }
    }
  }catch(e){ /* no saved data yet, keep defaults */ }
  }
  renderGrid();
}
async function persistState(){
  try{
    if(window.storage){
      await window.storage.set('menu-data', JSON.stringify(state), false);
    } else if(window.localStorage){
      window.localStorage.setItem('times-coffee-menu-data', JSON.stringify(state));
    }
  }catch(e){ console.error('storage error', e); }
  await syncPush();
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  state.categories.forEach((cat, idx)=>{
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.style.animationDelay = (idx*80)+'ms';
    card.onclick = ()=>{ const target=document.getElementById('seq-'+cat.id); if(target) target.scrollIntoView({behavior:'smooth',block:'start'}); };
    const iconHtml = cat.img
      ? `<img class="cat-img" src="${cat.img}">`
      : `<svg viewBox="0 0 24 24">${ICONS[cat.icon] || ICONS.hot}</svg>`;
    card.innerHTML = `
      <div class="cat-icon-box">${iconHtml}</div>
      <div class="cat-en">${cat.en}</div>
      <div class="cat-ar">${cat.ar}</div>
    `;
    grid.appendChild(card);
  });
  renderSequentialCategoryView();
}

  if(!cat) return;
  currentPanelCatId = id;
  document.getElementById('panel-en').textContent = cat.en;
  document.getElementById('panel-ar').textContent = cat.ar;
  const list = document.getElementById('items-list');
  list.innerHTML = cat.items.map(it=>`
    <div class="item-row">
      <div class="item-icon">
        ${it.img ? `<img src="${it.img}">` : `<svg viewBox="0 0 24 24">${ICONS[cat.icon] || ICONS.hot}</svg>`}
      </div>
      <div class="item-info">
        <div class="name-en">${it.en}</div>
        <div class="name-ar">${it.ar}</div>
      </div>
      <div class="item-price">${it.price}</div>
    </div>
  `).join('');
  document.getElementById('overlay').classList.add('open');
}
function closePanel(){
  document.getElementById('overlay').classList.remove('open');
}
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') closePanel();
});

/* ===== Admin: 5-tap trigger ===== */
let tapCount = 0, tapTimer = null;
document.getElementById('logoTap').addEventListener('click', ()=>{
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(()=>{ tapCount = 0; }, 1500);
  if(tapCount >= 5){
    tapCount = 0;
    openPin();
  }
});

function openPin(){
  document.getElementById('pinInput').value = '';
  document.getElementById('pinError').textContent = '';
  document.getElementById('pinOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('pinInput').focus(), 100);
}
function closePin(){
  document.getElementById('pinOverlay').classList.remove('open');
}
async function checkPin(){
  const val = document.getElementById('pinInput').value;
  const hash = await sha256Hex(val);
  if(hash === PIN_HASH){
    closePin();
    openAdmin();
  } else {
    document.getElementById('pinError').textContent = 'رمز غير صحيح';
  }
}
document.getElementById('pinInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') checkPin();
});

/* ===== Admin panel ===== */
function openAdmin(){
  renderAdmin();
  document.getElementById('adminOverlay').classList.add('open');
}
function closeAdmin(){
  document.getElementById('adminOverlay').classList.remove('open');
  renderGrid();
}

function renderAdmin(){
  const body = document.getElementById('adminBody');
  let html = `<button class="admin-add-cat" onclick="addCategory()">+ إضافة قسم جديد</button>`;
  state.categories.forEach(cat=>{
    html += `
      <div class="admin-cat">
        <div class="admin-row">
          <input type="text" value="${escapeHtml(cat.en)}" placeholder="اسم القسم بالإنجليزي" oninput="updateCat('${cat.id}','en',this.value)">
          <input type="text" value="${escapeHtml(cat.ar)}" placeholder="اسم القسم بالعربي" oninput="updateCat('${cat.id}','ar',this.value)">
        </div>
        <div class="admin-thumb-row">
          ${cat.img ? `<img class="admin-thumb" src="${cat.img}">` : ''}
          <label class="admin-file-label">تغيير صورة القسم
            <input type="file" accept="image/*" onchange="uploadCatImage(event,'${cat.id}')">
          </label>
          <button class="admin-del-btn" onclick="deleteCategory('${cat.id}')">حذف القسم</button>
        </div>
        <div class="admin-items">
          ${cat.items.map(it=>`
            <div class="admin-item-row">
              ${it.img ? `<img class="admin-thumb" style="width:34px;height:34px" src="${it.img}">` : ''}
              <label class="admin-file-label" style="padding:6px 8px;">📷
                <input type="file" accept="image/*" onchange="uploadItemImage(event,'${cat.id}','${it.id}')">
              </label>
              <input class="fen" type="text" value="${escapeHtml(it.en)}" placeholder="الاسم EN" oninput="updateItem('${cat.id}','${it.id}','en',this.value)">
              <input class="far" type="text" value="${escapeHtml(it.ar)}" placeholder="الاسم AR" oninput="updateItem('${cat.id}','${it.id}','ar',this.value)">
              <input class="fprice" type="text" value="${escapeHtml(it.price)}" placeholder="السعر" oninput="updateItem('${cat.id}','${it.id}','price',this.value)">
              <button class="admin-del-btn" onclick="deleteItem('${cat.id}','${it.id}')">✕</button>
            </div>
          `).join('')}
          <button class="admin-add-item" onclick="addItem('${cat.id}')">+ إضافة صنف</button>
        </div>
      </div>
    `;
  });
  body.innerHTML = html;
  renderSyncBox();
}

function renderSyncBox(){
  const box = document.getElementById('syncBox');
  if(!box) return;
  const id = getSyncId();
  if(id){
    box.innerHTML = `
      <h3>🔗 المزامنة بين الأجهزة</h3>
      <div class="sync-status">هذا الجهاز متصل بكود مشترك. أي تعديل تحفظه هون بيظهر على كل الأجهزة المتصلة بنفس الكود.</div>
      <div class="sync-code">${id}</div>
      <div class="sync-status">شارك هذا الكود مع باقي الأجهزة (بالأدمن ← ألصق الكود ← اتصال) عشان توصلهم نفس البيانات.</div>
      <div class="sync-row">
        <button class="sync-btn secondary" onclick="unlinkSync()">فصل المزامنة عن هذا الجهاز</button>
      </div>
    `;
  } else {
    box.innerHTML = `
      <h3>🔗 المزامنة بين الأجهزة</h3>
      <div class="sync-status">لسا ما فيه مزامنة مفعّلة. اعمل واحد من اثنين:</div>
      <div class="sync-row">
        <button class="sync-btn" onclick="createSync()">إنشاء مزامنة جديدة من هذا الجهاز</button>
      </div>
      <div class="sync-status" style="margin-top:10px;">أو إذا عندك كود من جهاز ثاني، ألصقه هون:</div>
      <div class="sync-row">
        <input type="text" id="syncIdInput" placeholder="الصق الكود هون">
        <button class="sync-btn" onclick="linkSync(document.getElementById('syncIdInput').value)">اتصال</button>
      </div>
    `;
  }
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateCat(id, field, value){
  const cat = state.categories.find(c=>c.id===id);
  if(cat) cat[field] = value;
}
function updateItem(catId, itemId, field, value){
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat) return;
  const it = cat.items.find(i=>i.id===itemId);
  if(it) it[field] = value;
}
function deleteCategory(id){
  if(!confirm('حذف هذا القسم بالكامل؟')) return;
  state.categories = state.categories.filter(c=>c.id!==id);
  renderAdmin();
}
function deleteItem(catId, itemId){
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat) return;
  cat.items = cat.items.filter(i=>i.id!==itemId);
  renderAdmin();
}
function addItem(catId){
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat) return;
  cat.items.push({ id: uid(), en:'صنف جديد', ar:'صنف جديد', price:'0 ر.س' });
  renderAdmin();
}
function addCategory(){
  state.categories.push({ id: uid(), key:'hot', icon:'hot', en:'New Category', ar:'قسم جديد', items:[] });
  renderAdmin();
}
function uploadCatImage(event, catId){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    const cat = state.categories.find(c=>c.id===catId);
    if(cat){ cat.img = reader.result; renderAdmin(); await persistState(); }
  };
  reader.readAsDataURL(file);
}
function uploadItemImage(event, catId, itemId){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    const cat = state.categories.find(c=>c.id===catId);
    const it = cat && cat.items.find(i=>i.id===itemId);
    if(it){ it.img = reader.result; renderAdmin(); await persistState(); }
  };
  reader.readAsDataURL(file);
}
async function saveAdmin(){
  await persistState();
  const msg = document.getElementById('savedMsg');
  msg.textContent = '✓ تم الحفظ بنجاح';
  setTimeout(()=>{ msg.textContent=''; }, 2000);
  renderGrid();
}

loadState();

function renderSequentialCategoryView(){
  const host=document.getElementById('sequentialCategoryView');
  if(!host || typeof state==='undefined' || !state.categories) return;
  host.innerHTML=state.categories.map(cat=>`
    <section id="seq-${cat.id}" class="sequential-category-section">
      <div class="seq-title">
        <div class="ar">${cat.ar||''}</div>
        <div class="en">${cat.en||''}</div>
      </div>
      <div class="seq-line"></div>
      <div class="sequential-items">
        ${(cat.items||[]).map(it=>`
          <div class="sequential-item">
            <div class="item-icon">${it.img?`<img src="${it.img}">`:`<svg viewBox="0 0 24 24">${ICONS[cat.icon]||ICONS.hot}</svg>`}</div>
            <div class="item-name">
              <div class="en">${it.en||''}</div>
              <div class="ar">${it.ar||''}</div>
              <div class="item-price">${it.price||''}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </section>
  `).join('');
}



</script>
